; Router ninfer V100 :8090 — artefactos seleccionables (curated).
; Formato llama.cpp-preset: [*] = para todos, [id] = por modelo (gana sobre [*]).
; Cada id = lo que ve el desplegable de Hermes (model field del request).
; Los flags de la UI del wrapper ninfer-serve.sh (vision, MTP, prefill) van aqui sin guiones.

[*]
; --host/--port son del router (no por modelo)
max-context = 65536
max-concurrency = 4
default-max-tokens = 8192
; Descarga el modelo tras 300 s sin peticiones: la V100 no queda atada
; (y quemando) cuando nadie la usa. La siguiente peticion la recarga (~45-70 s).
; Evita el "generando calor sin sentido" tras la ultima peticion del dia.
unload-idle-seconds = 300
prefill-cublas = true
prefill-chunk = 2048
spec = mtp
vision = true
media-cache-mib = 1024
media-live-mib = 2048

; --- Qwen3.8-35B-A3B-Distill (nuevo, con proposal head) ---
[qwen3.8-35b-a3b]
; Cargado bajo demanda desde DISCO (libera ~22 GB de RAM; swap mas lento ~45-70s).
model = /models/qwen38-35b-a3b-distill.ninfer
kv-dtype = rk4v4
draft-tokens = 3
lm-head-draft = true
mtp-experts-q4 = true
gdn-state-fp16 = true

; --- Gemma-4-26B (produccion actual) ---
; Cargado desde RAM (/dev/shm, tmpfs del contenedor) → swap ~9s en vez de ~42s
; desde SATA. ninfer-router.sh recopia el artefacto al /dev/shm si falta.
[gemma-4]
model = /dev/shm/gemma.ninfer
kv-dtype = bf16
draft-tokens = 2
