; Router ninfer V100 :8090 — artefactos seleccionables (curated).
; Formato llama.cpp-preset: [*] = para todos, [id] = por modelo (gana sobre [*]).
; Cada id = lo que ve el desplegable de Hermes (model field del request).
; Los flags de la UI del wrapper ninfer-serve.sh (vision, MTP, prefill) van aqui sin guiones.

[*]
; --host/--port son del router (no por modelo)
max-context = 65536
max-concurrency = 4
default-max-tokens = 8192
; Sin unload-idle: el modelo queda residente mientras el router viva.
prefill-cublas = true
prefill-chunk = 2048
spec = mtp
vision = true
media-cache-mib = 1024
media-live-mib = 2048

; --- Qwen3.8-35B-A3B-Distill (nuevo, con proposal head) ---
[qwen3.8-35b-a3b]
; En tmpfs (/dev/shm) para swap rapido (~10 s); RAM fija ~22 GB.
model = /dev/shm/qwen.ninfer
kv-dtype = rk4v4
draft-tokens = 3
lm-head-draft = true
mtp-experts-q4 = true
gdn-state-fp16 = true

; --- Gemma-4 QAT MTP ---
[gemma-4]
; En tmpfs (/dev/shm) para swap rapido (~10 s); RAM fija ~16 GB.
model = /dev/shm/gemma.ninfer
kv-dtype = bf16
draft-tokens = 2

; --- Qwen3.8-27B denso (neroued v2) ---
[qwen3.8-27b]
model = /models/qwen3_8_27b.ninfer
kv-dtype = int8
draft-tokens = 3
