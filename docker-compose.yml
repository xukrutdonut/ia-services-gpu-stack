networks:
  ia-routing-stack:
    driver: bridge
volumes:
  openvino-models: null
  ov_cache: null
  lms-config: null
  open-webui-data: null
  open-terminal-data: null
  lms_amd_profile:
    external: true
    name: lms_amd_profile
services:
  # ==========================================
  # SECCIÓN MCP (Model Context Protocol Servers)
  # Transporte: streamable-http (compatible nativo con Open WebUI >= 0.11)
  # ==========================================

  # Open Terminal - servidor REST oficial de open-webui/open-terminal
  # Integracion nativa en Open WebUI (Admin Settings -> Integrations -> Open Terminal)
  # Da barra lateral con file browser, upload/download, editor y ejecucion de comandos
  open-terminal:
    image: ghcr.io/open-webui/open-terminal:slim
    container_name: open-terminal
    restart: unless-stopped
    ports:
      - "8003:8000"
    environment:
      - OPEN_TERMINAL_API_KEY=XMaT-ey_ekoJ9zHJITPpNQilqi_o9Sqy7G4q0jo1gyE
      - OPEN_TERMINAL_FILE_BROWSER_ROOT=/workspace
    volumes:
      - open-terminal-data:/home/user
      - /home/arkantu/workspace:/workspace
    networks:
      - ia-routing-stack
    deploy:
      placement:
        constraints:
        - node.hostname == khazad-dum

  fetch-mcp:
    build:
      context: ./mcp-servers/fetch-mcp
      dockerfile: Dockerfile
    image: fetch-mcp:latest
    container_name: fetch-mcp
    restart: unless-stopped
    ports:
      - "8095:8095"
    networks:
      - ia-routing-stack
    deploy:
      placement:
        constraints:
        - node.hostname == khazad-dum

  nano-fs-tools-mcp:
    build:
      context: ./mcp-servers/nano-fs-tools-mcp
      dockerfile: Dockerfile
    image: nano-fs-tools-mcp:latest
    container_name: nano-fs-tools-mcp
    restart: unless-stopped
    ports:
      - "8096:8096"
    volumes:
      - /home/arkantu/produccion:/workspace
    environment:
      - WORKSPACE_DIR=/workspace
      - OPENVINO_GENAI_URL=http://ia-gpu-intel-openvino:8000/v1
      - INTEL_OPENVINO_URL=http://ia-gpu-intel-openvino:8000/v1
      - AMD_NODE_URL=http://ia-gpu-amd-rx480:1234/v1
    networks:
      - ia-routing-stack
    deploy:
      placement:
        constraints:
        - node.hostname == khazad-dum

  zotero-mcp:
    build:
      context: ./mcp-servers/zotero-mcp
      dockerfile: Dockerfile
    image: zotero-mcp:latest
    container_name: zotero-mcp
    restart: unless-stopped
    # network_mode: host is required because Zotero's local API (port 23119)
    # listens on 127.0.0.1 only, and pyzotero hardcodes localhost:23119.
    # open-webui reaches this server via http://172.18.0.1:8765/mcp (docker bridge gateway).
    network_mode: host
    volumes:
      - /home/arkantu/Zotero:/root/Zotero:ro
      - /home/arkantu/.config/zotero-mcp:/root/.config/zotero-mcp
    environment:
      - ZOTERO_LOCAL=true

  moodle-ia-mcp:
    build:
      context: ./mcp-servers/moodle-ia-mcp
      dockerfile: Dockerfile
    image: moodle-ia-mcp:latest
    container_name: moodle-ia-mcp
    restart: unless-stopped
    ports:
      - "8097:8097"
    environment:
      - MOODLE_URL=https://moodle.neuropedialab.org
      - MOODLE_TOKEN=734d7e02718f02570a70bdbc87698c78
      - INTEL_OPENVINO_URL=http://ia-gpu-intel-openvino:8000/v1
      - INTEL_FALLBACK_URL=http://192.168.0.100:8006/v1
      - AMD_NODE_URL=http://192.168.0.80:1234/v1
    networks:
      - ia-routing-stack
    deploy:
      placement:
        constraints:
        - node.hostname == khazad-dum

  # ==========================================
  # BENCHMARK UNIFICADO 2 BACKENDS
  # OpenVINO GenAI (Intel Arc iGPU, puerto 8006)
  # LM Studio RX480 (AMD RX480 Vulkan, puerto 1235)
  # Uso: docker compose --profile benchmark run --rm dual-gpu-benchmark
  #      docker compose --profile benchmark run --rm dual-gpu-benchmark -- --max-tokens 500
  #      docker compose --profile benchmark run --rm dual-gpu-benchmark -- --skip-openvino
  # ==========================================
  dual-gpu-benchmark:
    profiles: ["benchmark"]
    build:
      context: ./benchmark
      dockerfile: Dockerfile
    image: ia-dual-gpu-benchmark:latest
    container_name: dual-gpu-benchmark
    network_mode: host
    volumes:
      # Directorio de resultados
      - /home/arkantu/produccion/benchmark-results:/output
    environment:
      - OPENVINO_URL=http://127.0.0.1:8006
      - AMD_URL=http://127.0.0.1:1235
      - BENCHMARK_OUTPUT_DIR=/output
    deploy:
      placement:
        constraints:
        - node.hostname == khazad-dum

  # ==========================================
  # IA-GPU-INTEL-OPENVINO (OpenVINO GenAI)
  # Servidor OpenVINO GenAI nativo (puerto 8006) compatible OpenAI API
  # Usa Intel Arc iGPU Xe2 128EU via Level-Zero
  # Accesible desde LM Studio Desktop via plugin openvino-genai-bridge
  # Panel de administracion GPU en /admin
  # ==========================================
  ia-gpu-intel-openvino:
    image: openvino/model_server:latest-gpu
    container_name: ia-gpu-intel-openvino
    restart: unless-stopped
    shm_size: "64gb"
    ports:
      - "8006:8000"
    ipc: host
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    devices:
      - /dev/dri/card0:/dev/dri/card0
      - /dev/dri/renderD129:/dev/dri/renderD129
      - /dev/accel/accel0:/dev/accel/accel0
    group_add:
      - "44"
      - "992"
    volumes:
      - /home/arkantu/produccion/openvino-models/.openvino-ir:/models:rw
      - ov_cache:/tmp/ov_cache
    command:
      - --config_path
      - /models/config.json
      - --rest_port
      - "8000"
      - --port
      - "9000"
      - --log_level
      - INFO
    environment:
      - ONEAPI_DEVICE_SELECTOR=level_zero:0
      - ZES_ENABLE_SYSMAN=1
      - ZE_AFFINITY_MASK=0
      - UR_L0_ENABLE_RELAXED_ALLOCATION_LIMITS=1
      - SYCL_PI_LEVEL_ZERO_USM_RESIDENT=1
      - NEOReadDebugKeys=1
      - OverrideGpuAddressSpace=48
      - DisableImplicitScaling=0
      - IGC_EnableDPEmulation=0
      - MESA_VK_DEVICE_SELECT=8086:7d51!
      - GGML_VK_VISIBLE_DEVICES=0
      - OMP_NUM_THREADS=16
      - KMP_AFFINITY=granularity=fine,compact,1,0
      - NPU_PLATFORM=3720
    networks:
      - ia-routing-stack
    deploy:
      placement:
        constraints:
        - node.hostname == khazad-dum

  # ==========================================
  # IA-GPU-AMD-RX480 (LM Studio / LMLink)
  # RX480 aislada del host - este contenedor es el UNICO que accede a la GPU AMD
  # Host y OpenVINO usan solo Intel Arc (iGPU 00:02.0)
  # RX480 = renderD128 / card1 (PCI 01:00.0, vendor 1002:67df)
  # Sin ipc: host - namespace IPC propio para que el GUI del host no detecte
  # el llmster del contenedor como instancia local. LMLink conecta por TCP.
  # ==========================================
  ia-gpu-amd-rx480:
    build:
      context: ./ia-gpu-amd-rx480
      dockerfile: Dockerfile
    image: ia-gpu-amd-rx480:latest
    container_name: ia-gpu-amd-rx480
    # RESTART DESACTIVADO a proposito (2026-10-01). Con la GPU en estado wedged
    # (page fault + ring timeout, requiere cold boot) "unless-stopped" entra en
    # bucle de reinicio cada 6s. Reactivar a "unless-stopped" SOLO despues de
    # validar los cambios de estabilidad en un cold boot (ver
    # ia-gpu-amd-rx480/DIAGNOSTICO-RX480-2026-10-01.md).
    restart: "no"
    ports:
      - "1235:1234"
      # 41344 (LMLink) no se publica al host para evitar conflictos
      # con conexiones efimeras SSH. LMLink no se usa en benchmarks.
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - lms_amd_profile:/root/.lmstudio
      - /home/arkantu/modelos/rx480:/root/.lmstudio/models/rx480:ro
      - ./ia-gpu-amd-rx480/entrypoint.sh:/root/lms-amd-entrypoint.sh:ro
    devices:
      - /dev/dri/card1:/dev/dri/card1
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/kfd:/dev/kfd
    environment:
      - MESA_VK_DEVICE_SELECT=1002:67df!
      - DRI_PRIME=1
      - GGML_VK_VISIBLE_DEVICES=0
      - VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/radeon_icd.json
      # Anti ring-timeout: batches de 100 nodos tardan >2s en Polaris ->
      # kernel declara ring timeout -> GPU reset -> reset falla -> crash.
      # Con 1 nodo por submit, cada vkQueueSubmit completa en <100ms.
      - GGML_VK_MAX_NODES_PER_SUBMIT=1
      - GGML_VK_DISABLE_ASYNC=1
      - GGML_VK_FORCE_MAX_ALLOCATION_SIZE=2147483648
      # NOTA (2026-10-01) sobre variables ELIMINADAS tras verificarlas con strings
      # sobre libggml-vulkan.so / libvulkan_radeon.so y con prueba empirica:
      #  - RADV_PERFTEST=no_sam : NO EXISTE. El token real de Mesa es 'nosam'
      #    (sin guion), y ademas en Mesa 25.2.8 ya no es un perftest sino una
      #    driconf option. Con 'no_sam' RADV lo ignora -> sparseResidency seguia
      #    en true y el kernel seguia imprimiendo "Disabling VM faults because of
      #    PRT request!" al crear el device Vulkan. Config muerta, se elimina.
      #  - GGML_VK_ALLOW_EXOTIC_SUBGROUP_OPS : NO EXISTE en libggml-vulkan.so
      #    (verificado con strings). El driver Radv de esta version no expone
      #    subgroups exoticas, asi que era un no-op. Se elimina.
      #  - DRI_PRIME=1 : la RX480 es el segundo dispositivo; MESA_VK_DEVICE_SELECT
      #    ya la fija de forma exacta. DRI_PRIME afecta GL/EGL, no a Vulkan.
      #    Se mantiene por compatibilidad, no hace daño.
    entrypoint: ["/root/lms-amd-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --max-time 5 http://localhost:1234/api/v0/models || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - ia-routing-stack
    deploy:
      placement:
        constraints:
        - node.hostname == khazad-dum

  # ==========================================
  # Open WebUI - Frontend unificado para los backends GPU
  # Expone dos conexiones OpenAI-compatible:
  #   1. ia-gpu-intel-openvino (Intel Arc / OpenVINO GenAI) -> http://ia-gpu-intel-openvino:8000
  #   2. ia-gpu-amd-rx480 (AMD RX480 / LM Studio)            -> http://ia-gpu-amd-rx480:1234
  # Ambos backends no requieren API key real; usamos un placeholder "ollama".
  # Los tags y prefix_id permiten distinguir los modelos de cada GPU en la UI.
  # ==========================================
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - open-webui-data:/app/backend/data
    environment:
      # --- Backends OpenAI-compatible (separados por ';') ---
      # Backend 0: Intel Arc (OpenVINO GenAI)
      # Backend 1: AMD RX480 (LM Studio)
      - ENABLE_OPENAI_API=True
      - OPENAI_API_BASE_URLS=http://ia-gpu-intel-openvino:8000/v1;http://ia-gpu-amd-rx480:1234/v1
      - OPENAI_API_KEYS=ollama;ollama
      - OPENAI_API_CONFIGS={"0":{"prefix_id":"intel-arc","tags":["OpenVINO","Intel-Arc"]},"1":{"prefix_id":"amd-rx480","tags":["LM-Studio","AMD-RX480"]}}
      # --- Ollama deshabilitado (no hay Ollama en este stack) ---
      - ENABLE_OLLAMA_API=False
      # --- Config general ---
      - WEBUI_AUTH=true
      - ENABLE_SIGNUP=False
      - WEBUI_NAME=IA Services Stack
      # Forzar que las variables de entorno prevalezcan sobre la BD
      # para que los backends se carguen siempre al arrancar
      - ENABLE_PERSISTENT_CONFIG=False
      # Busqueda web nativa de Open WebUI (DuckDuckGo, sin contenedor extra)
      - ENABLE_WEB_SEARCH=True
      - WEB_SEARCH_ENGINE=duckduckgo
      - WEB_SEARCH_RESULT_COUNT=5
      - WEB_SEARCH_CONCURRENT_REQUESTS=5
      # MCP tool servers (cargados desde env var porque ENABLE_PERSISTENT_CONFIG=False
      # hace que Config.get() ignore la BD y use los defaults de DEFAULT_CONFIG)
      - TOOL_SERVER_CONNECTIONS=[{"url":"http://moodle-ia-mcp:8097/mcp","path":"/mcp","type":"mcp","auth_type":"none","headers":null,"key":null,"config":{"enable":true,"access_grants":[]},"info":{"id":"moodle-ia","name":"Moodle-IA MCP","description":"Moodle content orchestrator MCP server"}},{"url":"http://172.18.0.1:8765/mcp","path":"/mcp","type":"mcp","auth_type":"none","headers":null,"key":null,"config":{"enable":true,"access_grants":[]},"info":{"id":"zotero-mcp","name":"Zotero MCP","description":"Zotero local library - semantic search, citations, PDF tools"}}]
      # Open Terminal server (cargado desde env var porque ENABLE_PERSISTENT_CONFIG=False)
      - TERMINAL_SERVER_CONNECTIONS=[{"id":"open-terminal-local","name":"Open Terminal (Khazad-dum)","enabled":true,"url":"http://open-terminal:8000","path":"/openapi.json","key":"XMaT-ey_ekoJ9zHJITPpNQilqi_o9Sqy7G4q0jo1gyE","auth_type":"bearer"}]
    networks:
      - ia-routing-stack
    deploy:
      placement:
        constraints:
        - node.hostname == khazad-dum