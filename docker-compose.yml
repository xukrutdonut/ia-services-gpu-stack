networks:
  ia-routing-stack:
    driver: bridge
volumes:
  hermes-agent-src: null
  openvino-models: null
  ov_cache: null
  lms-config: null
  open-terminal-data: null
services:
  # Hermes ejecuta el agente in-process; el init obtiene su código y submódulos.
  hermes-agent-init:
    image: ${HERMES_WEBUI_IMAGE:-ghcr.io/nesquena/hermes-webui:0.52.666}
    entrypoint: ["/bin/bash", "/init-agent.sh"]
    environment:
      HERMES_AGENT_REF: ${HERMES_AGENT_REF:-0ea6ea941aee31b20fffeb6dfa0d0f29f4370e2e}
      WANTED_UID: ${HERMES_UID:-1000}
      WANTED_GID: ${HERMES_GID:-1000}
    volumes:
      - hermes-agent-src:/opt/hermes
      - ./hermes-webui/init-agent.sh:/init-agent.sh:ro
    restart: "no"

  hermes-webui:
    image: ${HERMES_WEBUI_IMAGE:-ghcr.io/nesquena/hermes-webui:0.52.666}
    # Linux: localhost del agente alcanza los proveedores/MCP publicados en el host.
    network_mode: host
    depends_on:
      hermes-agent-init:
        condition: service_completed_successfully
    environment:
      HERMES_WEBUI_HOST: ${HERMES_WEBUI_HOST:-127.0.0.1}
      HERMES_WEBUI_PORT: ${HERMES_WEBUI_PORT:-8787}
      HERMES_WEBUI_STATE_DIR: /home/hermeswebui/.hermes/webui
      HERMES_WEBUI_DEFAULT_WORKSPACE: /workspace
      HERMES_WEBUI_PASSWORD: ${HERMES_WEBUI_PASSWORD:-}
      HERMES_SKIP_CHMOD: "1"
      WANTED_UID: ${HERMES_UID:-1000}
      WANTED_GID: ${HERMES_GID:-1000}
    volumes:
      - ${HERMES_HOME:-${HOME}/.hermes}:/home/hermeswebui/.hermes
      - hermes-agent-src:/home/hermeswebui/.hermes/hermes-agent:ro
      - ${HERMES_WORKSPACE:-${HOME}/workspace}:/workspace
      # Conserva terminal.cwd y las rutas absolutas del CLI dentro del contenedor.
      - ${HERMES_WORKSPACE:-${HOME}/workspace}:${HERMES_WORKSPACE:-${HOME}/workspace}
    healthcheck:
      test: ["CMD-SHELL", "curl --noproxy '*' -fsS http://127.0.0.1:$${HERMES_WEBUI_PORT}/health >/dev/null"]
      interval: 30s
      timeout: 8s
      start_period: 300s
      retries: 5
    restart: unless-stopped

  # ==========================================
  # SECCIÓN MCP (Model Context Protocol Servers)
  # Transportes SSE y streamable-http para clientes MCP independientes.
  # ==========================================

  # Open Terminal - servidor REST y backend de ejecucion compartido.
  # Es independiente del frontend retirado: lo conservan los agentes que usan su API.
  # Da file browser, upload/download, editor y ejecucion de comandos.
  # Imagen propia: open-terminal/Dockerfile anade pip + toolchain de programacion/IA
  # sobre ghcr.io/open-webui/open-terminal:slim (que no trae pip a proposito).
  open-terminal:
    build:
      context: ./open-terminal
      dockerfile: Dockerfile
    image: open-terminal:tools
    container_name: open-terminal
    restart: unless-stopped
    ports:
      - "8003:8000"
    environment:
      - OPEN_TERMINAL_API_KEY=XMaT-ey_ekoJ9zHJITPpNQilqi_o9Sqy7G4q0jo1gyE
      - OPEN_TERMINAL_FILE_BROWSER_ROOT=/workspace
    volumes:
      - open-terminal-data:/home/user
      - /home/arkantu/workspace:/workspace
    networks:
      - ia-routing-stack
    deploy:
      placement:
        constraints:
        - node.hostname == khazad-dum

  # SearXNG - metabuscador (backend de busqueda para searxng-mcp y para el
  # backend `searxng` de Hermes en config.yaml). Puerto host 8085 -> 8080.
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "8085:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - ia-routing-stack
    deploy:
      placement:
        constraints:
        - node.hostname == khazad-dum

  # MCP server de busqueda web (tool `search_web`). Usa SearXNG interno y
  # cae a DDGS si SearXNG no responde. Transporte SSE en /sse (patron
  # consumido por LM Studio y por mcp-bridge/oi_mcp_proxy.py).
  searxng-mcp:
    build:
      context: ./mcp-servers/searxng-mcp
      dockerfile: Dockerfile
    image: searxng-mcp:latest
    container_name: searxng-mcp
    restart: unless-stopped
    ports:
      - "8092:8092"
    environment:
      - SEARXNG_URL=http://searxng:8080
    depends_on:
      - searxng
    networks:
      - ia-routing-stack
    deploy:
      placement:
        constraints:
        - node.hostname == khazad-dum

  moodle-ia-mcp:
    build:
      context: ./mcp-servers/moodle-ia-mcp
      dockerfile: Dockerfile
    image: moodle-ia-mcp:latest
    container_name: moodle-ia-mcp
    restart: unless-stopped
    ports:
      - "8097:8097"
    environment:
      - MOODLE_URL=https://moodle.neuropedialab.org
      - MOODLE_TOKEN=${MOODLE_TOKEN:?define MOODLE_TOKEN en .env}
      - INTEL_OPENVINO_URL=http://ia-gpu-intel-openvino:8000/v1
      - INTEL_FALLBACK_URL=http://192.168.0.100:8006/v1
      - DEFAULT_MODEL_INTEL=Qwen3-30B-A3B-Instruct-2507-int4-ov
      - LLM_TIMEOUT=900
    networks:
      - ia-routing-stack
    deploy:
      placement:
        constraints:
        - node.hostname == khazad-dum

  # ==========================================
  # DOCKER-AGENT (runner de agentes cagent)
  # CLI, no servicio: `profiles: ["agent"]` evita que arranque con `up -d`.
  #   docker compose run --rm docker-agent "pregunta"
  #   docker compose run --rm docker-agent            # TUI
  # Wrapper: ~/.local/bin/docker-agent.
  # Genérico: NO lleva Zotero. Perfil por defecto /configs/default.yaml con las
  # herramientas nativas de cagent (shell, filesystem, fetch, think).
  # network_mode: host porque los modelos escuchan en loopback del host
  # (OVMS :8006, RX480 .80:1237, LM Studio :1234) y cagent rechaza MCP remoto en
  # direcciones privadas.
  # ==========================================
  docker-agent:
    profiles: ["agent"]
    build:
      context: /home/arkantu/workspace/docker-agent
      args:
        CAGENT_VERSION: ${CAGENT_VERSION:-latest}
        ZOTERO_MCP_VERSION: ${ZOTERO_MCP_VERSION:-0.15.1}
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: docker-agent:local
    container_name: docker-agent
    network_mode: host
    working_dir: /workspace
    environment:
      - TZ=Europe/Madrid
      - AGENT_CONFIG=${AGENT_CONFIG:-/configs/default.yaml}
    volumes:
      - /home/arkantu/workspace/docker-agent/configs:/configs:ro
      - /home/arkantu/workspace/docker-agent/integrations:/integrations:ro
      # el agente trabaja sobre el workspace del host y deja sus salidas en out/
      - /home/arkantu/workspace:/workspace
      - /home/arkantu/workspace/docker-agent/out:/out
      # historial de sesiones de cagent (para depurar turnos y tool calls)
      - /home/arkantu/.local/share/docker-agent/cagent:/home/agent/.cagent
    stdin_open: true
    tty: true

  # Integración Zotero del runner (opt-in, NO es el perfil por defecto). Es la pieza
  # donde enganchará el plugin de Zotero cuando se enrute al cagent.
  #   docker compose --profile agent-zotero run --rm docker-agent-zotero "..."
  docker-agent-zotero:
    profiles: ["agent-zotero"]
    image: docker-agent:local
    container_name: docker-agent-zotero
    network_mode: host
    working_dir: /workspace
    environment:
      - TZ=Europe/Madrid
      - AGENT_CONFIG=${AGENT_CONFIG:-/integrations/zotero/zotero.yaml}
      - ZOTERO_LOCAL=true
      # Sin esto FastMCP pinta su banner ASCII en stdout y rompe el stdio JSON-RPC
      # del MCP de Zotero: el agente se queda colgado sin error.
      - FASTMCP_SHOW_SERVER_BANNER=false
      - FASTMCP_CHECK_FOR_UPDATES=off
      - ZOTERO_MCP_TOOLSETS=${ZOTERO_MCP_TOOLSETS:-semantic}
    volumes:
      - /home/arkantu/workspace/docker-agent/configs:/configs:ro
      - /home/arkantu/workspace/docker-agent/integrations:/integrations:ro
      - /home/arkantu/.config/zotero-mcp:/home/agent/.config/zotero-mcp
      - /home/arkantu/Zotero:/home/agent/Zotero:ro
      - /home/arkantu/workspace:/workspace
      - /home/arkantu/workspace/docker-agent/out:/out
      - /home/arkantu/.local/share/docker-agent/cagent:/home/agent/.cagent
    stdin_open: true
    tty: true

  # ==========================================
  # IA-GPU-INTEL-OPENVINO (OpenVINO GenAI)
  # Servidor OpenVINO GenAI nativo (puerto 8006) compatible OpenAI API
  # Usa Intel Arc iGPU Xe2 128EU via Level-Zero
  # Accesible desde LM Studio Desktop via plugin openvino-genai-bridge
  # Panel de administracion GPU en /admin
  # ==========================================
  ia-gpu-intel-openvino:
    image: openvino/model_server:latest-gpu
    container_name: ia-gpu-intel-openvino
    restart: unless-stopped
    shm_size: "8gb"
    mem_limit: 44g
    memswap_limit: 44g
    ports:
      - "8006:8000"
    ipc: host
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    devices:
      # Solo el iGPU Intel (00:02.0) + NPU. (Los nodos de la RX480 se retiraron
      # el 2026-10-23 al quitar la GPU del sistema.)
      # by-path: estable por PCI (la reenumeracion del kernel cambia cardN entre
      # arranques; incluso hubo boots sin card0).
      - source: /dev/dri/by-path/pci-0000:00:02.0-card
        target: /dev/dri/card0
        permissions: rwm
      - source: /dev/dri/by-path/pci-0000:00:02.0-render
        target: /dev/dri/renderD128
        permissions: rwm
      - /dev/accel/accel0:/dev/accel/accel0
    group_add:
      - "44"
      - "992"
    volumes:
      - /home/arkantu/produccion/openvino-models/.openvino-ir:/models:rw
      - ov_cache:/tmp/ov_cache
    command:
      - --config_path
      - /models/config.json
      - --rest_port
      - "8000"
      - --port
      - "9000"
      - --log_level
      - INFO
    environment:
      - ONEAPI_DEVICE_SELECTOR=level_zero:0
      - ZES_ENABLE_SYSMAN=1
      - ZE_AFFINITY_MASK=0
      - UR_L0_ENABLE_RELAXED_ALLOCATION_LIMITS=1
      - SYCL_PI_LEVEL_ZERO_USM_RESIDENT=1
      - NEOReadDebugKeys=1
      - OverrideGpuAddressSpace=48
      - DisableImplicitScaling=0
      - IGC_EnableDPEmulation=0
      - MESA_VK_DEVICE_SELECT=8086:7d51!
      - GGML_VK_VISIBLE_DEVICES=0
      - OMP_NUM_THREADS=16
      - KMP_AFFINITY=granularity=fine,compact,1,0
      - NPU_PLATFORM=3720
    networks:
      - ia-routing-stack
    deploy:
      placement:
        constraints:
        - node.hostname == khazad-dum

  # ==========================================
  # NINFER-SERVER (Tesla V100)
  # Motor ninfer propio, endpoint OpenAI-compatible en 127.0.0.1:8090 con
  # model-id "ninfer" (vision incluida). La imagen ninfer-v100:bench lleva los
  # binarios; aquí solo se montan modelos y grafts.
  # El contenedor se mantiene vivo (sleep infinity): ninfer-serve.sh lanza y
  # relanza el motor dentro con `docker exec`, así se cambia de artefacto o de
  # contexto sin recrear el contenedor ni perder la GPU.
  # network_mode: host publica 8090 en loopback (Hermes lo usa en config.yaml)
  # y evita el NAT del bridge. La GPU entra por CDI.
  # Arranque del motor: ./ninfer-serve.sh [modelo] [ctx] [concurrencia] [draft]
  # ==========================================
  ninfer-server:
    # Perfil `ninfer`: la V100 es una eGPU y no siempre está enumerada
    # (sin ella, la inyección CDI falla y abortaría el `up -d` completo).
    # Arrancar en el host con la GPU presente:
    #   docker compose --profile ninfer up -d ninfer-server
    profiles: ["ninfer"]
    image: ninfer-v100:bench
    container_name: ninfer-serve
    restart: unless-stopped
    network_mode: host
    ipc: host
    devices:
      - nvidia.com/gpu=all
    volumes:
      - /home/arkantu/workspace/ninfer-v100/grafts:/grafts:ro
      - /home/arkantu/workspace/ninfer-v100/models:/models:ro
    command: ["sleep", "infinity"]
