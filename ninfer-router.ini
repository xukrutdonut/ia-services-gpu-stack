; Router ninfer V100 :8090 — artefactos seleccionables (curated).
; Formato llama.cpp-preset: [*] = para todos, [id] = por modelo (gana sobre [*]).
; Cada id = lo que ve el desplegable de Hermes (model field del request).
; Los flags de la UI del wrapper ninfer-serve.sh (vision, MTP, prefill) van aqui sin guiones.

[*]
; --host/--port son del router (no por modelo)
max-context = 65536
max-concurrency = 1
default-max-tokens = 8192
prefill-cublas = true
prefill-chunk = 2048
spec = mtp
vision = true
media-cache-mib = 1024
media-live-mib = 2048

; --- Qwen3.8-35B-A3B-Distill (nuevo, con proposal head) ---
[qwen3.8-35b-a3b]
model = /models/qwen38-35b-a3b-distill.ninfer
kv-dtype = rk4v4
draft-tokens = 3
lm-head-draft = true
mtp-experts-q4 = true
gdn-state-fp16 = true

; --- Qwen3.6-35B-A3B v3 (respaldo flagship) ---
[qwen3.6-35b-a3b-v3]
model = /models/qwen3_6_35b_a3b-v3.ninfer
kv-dtype = rk4v4
draft-tokens = 3
lm-head-draft = true
mtp-experts-q4 = true
gdn-state-fp16 = true

; --- Gemma-4-26B (produccion actual) ---
[gemma-4]
model = /models/gemma-4-26B-A4B-it-QAT-Q4_0-MTP-ninfer-v3.ninfer
kv-dtype = bf16
draft-tokens = 2
