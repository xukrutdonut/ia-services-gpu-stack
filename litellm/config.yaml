# Malla de inferencia - LiteLLM como unica puerta OpenAI-compatible (:4000)
#
# TOPOLOGIA (2026-11-09): la V100 sirve UN unico motor ninfer (:8090) y el id que
# expone es SIEMPRE `ninfer` (fijado con --model-id al arrancar). Dos artefactos:
#   qwen3_8_27b_nvfp4.ninfer  27B denso NVFP4 + MTP  -> por defecto (~219 tok/s)
#   qwen3_6_35b_a3b_v2.ninfer 35B MoE A3B            -> alternativa por swap (139 tok/s)
# Cambiar de artefacto NO toca este fichero: ./ninfer-serve.sh <fichero> [ctx] [conc].
#
# Alias que quedan (5). El resto (chat, fast, deep, vision, lms27, worker,
# worker-big, embed, embed-lite, qwen3.6-35b-a3b-mtp) se retiraron el 2026-11-09:
# eran duplicados del mismo motor y ensuciaban el selector de Open WebUI.
#   ninfer        -> V100, el unico que ve Open WebUI (clave acotada a este modelo)
#   arc           -> iGPU Intel/OVMS, titulos y tags de Open WebUI y respaldo
#   ocr           -> Hailo-8L .80:8089, OCR como "chat" (imagen -> texto)
#   embed-npu     -> NPU :8012, embeddings de texto 1024 d (pooling last-token)
#   embed-vision  -> Hailo-8L, CLIP ResNet-50x4, 640 d imagen-imagen
#
# Cola y backpressure:
#   - max_parallel_requests limita la concurrencia real por backend; el resto ESPERA (cola FIFO).
#   - rpm actua de valvula: pasado el limite LiteLLM responde 429 en vez de encolar sin fin.
#   - cooldown_time + allowed_fails: un backend que falla sale de rotacion 30s y entra el fallback.
model_list:
  # ============ carril V100 (motor ninfer :8090) ============
  - model_name: ninfer
    litellm_params:
      model: openai/ninfer
      api_base: http://host.docker.internal:8090/v1
      api_key: "sk-mesh"
      extra_body: {reasoning_effort: none}
      max_parallel_requests: 2
      rpm: 60
      timeout: 900
    model_info:
      gpu: v100
      engine: ninfer
      vision: true
      context_length: 262144
      max_input_tokens: 253952
      max_output_tokens: 8192

  # ============ carril Arc iGPU (OVMS :8006) - siempre encendido ============
  - model_name: arc
    litellm_params:
      model: openai/Qwen3-30B-A3B-Instruct-2507-int4-ov
      api_base: http://ia-gpu-intel-openvino:8000/v1
      api_key: "sk-mesh"
      max_parallel_requests: 3
      rpm: 180
      timeout: 300
    model_info:
      gpu: arc-igpu
      lane: aux

  # Misma familia que el embedding de la iGPU, pero compilada para la NPU
  # (systemd --user npu-embeddings.service en :8012). La NPU usa pooling
  # LAST-TOKEN (el correcto para Qwen3) y la iGPU CLS, asi que los vectores
  # NO son intercambiables: no poner fallback cruzado.
  - model_name: embed-npu
    litellm_params:
      model: openai/qwen3-embedding-0.6b-int4-ov
      api_base: http://host.docker.internal:8012/v1
      api_key: "sk-mesh"
      max_parallel_requests: 1
      rpm: 120
      timeout: 120
    model_info:
      gpu: intel-npu
      lane: embed

  # Embeddings de IMAGEN en el Hailo-8L del Pi5 (.80): input en data URI base64,
  # URL http(s) o base64 suelto; devuelve 640 d (CLIP ResNet-50x4, ~195 ms/imagen).
  # No hay torre de texto: sirve para similitud imagen-imagen, no para buscar con palabras.
  - model_name: embed-vision
    litellm_params:
      model: openai/clip-resnet-50x4-hailo
      api_base: http://192.168.0.80:8089/v1
      api_key: "sk-mesh"
      max_parallel_requests: 1
      rpm: 120
      timeout: 180
    model_info:
      gpu: hailo-8l
      lane: embed

  # OCR del Hailo-8L como "chat": se le pasa la imagen en content[].image_url y
  # devuelve el texto extraido. No conversa; sin imagen responde 400.
  - model_name: ocr
    litellm_params:
      model: openai/ocr-hailo-8l
      api_base: http://192.168.0.80:8089/v1
      api_key: "sk-mesh"
      max_parallel_requests: 1
      rpm: 60
      timeout: 600
    model_info:
      gpu: hailo-8l
      lane: ocr

router_settings:
  routing_strategy: least-busy
  num_retries: 1
  timeout: 900
  # ninfer es el UNICO carril de la V100: con allowed_fails=1 un 400 puntual
  # (p.ej. prompt gigante) lo sacaba de rotacion y todo daba 429.
  allowed_fails: 5
  cooldown_time: 30
  fallbacks:
    - ninfer: ["arc"]

litellm_settings:
  drop_params: true
  request_timeout: 900
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: false
