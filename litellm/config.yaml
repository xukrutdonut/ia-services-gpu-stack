# Malla de inferencia - LiteLLM como unica puerta OpenAI-compatible (:4000)
# Carriles: Arc/OVMS (siempre encendido) | V100/llama-swap (pesado)
#
# Cola y backpressure:
#   - max_parallel_requests limita la concurrencia real por backend; el resto ESPERA (cola FIFO).
#   - rpm actua de valvula: pasado el limite LiteLLM responde 429 en vez de encolar sin fin.
#   - cooldown_time + allowed_fails: un backend que falla sale de rotacion 60s y entra el fallback.
model_list:
  # ============ carril Arc iGPU (OVMS :8006) - defecto, tool-calling, bajo consumo ============
  - model_name: chat
    litellm_params:
      model: openai/Qwen3-30B-A3B-Instruct-2507-int4-ov
      api_base: http://ia-gpu-intel-openvino:8000/v1
      api_key: "sk-mesh"
      max_parallel_requests: 2
      rpm: 120
      timeout: 300
    model_info:
      gpu: arc-igpu
      lane: fast

  - model_name: embed
    litellm_params:
      model: openai/qwen3-embedding-0.6b-int4-ov
      api_base: http://ia-gpu-intel-openvino:8000/v1
      api_key: "sk-mesh"
      max_parallel_requests: 4
      rpm: 600
      timeout: 120
    model_info:
      gpu: arc-igpu
      lane: embed

  - model_name: embed-lite
    litellm_params:
      model: openai/nomic-embed-text-v1.5-ov
      api_base: http://ia-gpu-intel-openvino:8000/v1
      api_key: "sk-mesh"
      max_parallel_requests: 4
      rpm: 600
      timeout: 120
    model_info:
      gpu: arc-igpu
      lane: embed

  # ============ carril V100 (llama-swap :8011) - contexto largo, documentos, codigo ============
  - model_name: deep
    litellm_params:
      model: openai/qwen3.6-35b-a3b-mtp
      api_base: http://host.docker.internal:8011/v1
      api_key: "sk-mesh"
      extra_body: {chat_template_kwargs: {enable_thinking: false}}
      max_parallel_requests: 1
      rpm: 20
      timeout: 900
    model_info:
      gpu: v100
      lane: heavy

  - model_name: vision
    litellm_params:
      model: openai/qwen3.6-35b-a3b-mtp
      api_base: http://host.docker.internal:8011/v1
      api_key: "sk-mesh"
      extra_body: {chat_template_kwargs: {enable_thinking: false}}
      max_parallel_requests: 1
      rpm: 10
      timeout: 900
    model_info:
      gpu: v100
      lane: heavy

  - model_name: lms27
    litellm_params:
      model: openai/qwen3.8-27b
      api_base: http://host.docker.internal:8011/v1
      api_key: "sk-mesh"
      extra_body: {chat_template_kwargs: {enable_thinking: false}}
      max_parallel_requests: 1
      rpm: 20
      timeout: 900
    model_info:
      gpu: v100
      lane: heavy

  - model_name: worker-big
    litellm_params:
      model: openai/qwen3.5-9b
      api_base: http://host.docker.internal:8011/v1
      api_key: "sk-mesh"
      extra_body: {chat_template_kwargs: {enable_thinking: false}}
      max_parallel_requests: 2
      rpm: 120
      timeout: 600
    model_info:
      gpu: v100
      lane: heavy-light

  - model_name: worker
    litellm_params:
      model: openai/Qwen3-30B-A3B-Instruct-2507-int4-ov
      api_base: http://ia-gpu-intel-openvino:8000/v1
      api_key: "sk-mesh"
      max_parallel_requests: 2
      rpm: 120
      timeout: 300
    model_info:
      gpu: arc-igpu
      lane: parallel

router_settings:
  routing_strategy: least-busy
  num_retries: 1
  timeout: 900
  allowed_fails: 1   # un fallo basta para sacar el nodo 60s
  cooldown_time: 60
  fallbacks:
    - deep: ["chat"]
    - vision: ["deep", "chat"]
    - lms27: ["chat"]
    - worker-big: ["worker"]
    - worker: ["chat"]

litellm_settings:
  drop_params: true
  request_timeout: 900
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: false
